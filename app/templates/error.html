{% extends "base.html" %}
{% block content %}
<span class="eyebrow">PODEMOS INTENTARLO DE NUEVO</span>
<h2>No se pudo completar la solicitud</h2>
<p role="alert">{{ message }}</p>
{% if g.user %}
    <a class="button" href="{{ url_for('index') }}">Volver al inicio</a>
{% else %}
    <a class="button" href="{{ url_for('login') }}">Ir al acceso</a>
{% endif %}
{% endblock %}
